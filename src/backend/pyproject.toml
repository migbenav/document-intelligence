[project]
name = "document-intelligence-backend"
version = "0.1.0"
description = "Document Intelligence - Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",
    "supabase>=2.0.0",
    "python-multipart>=0.0.6",
    "uvicorn>=0.23.0",
    "litellm>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["../../../tests"]
asyncio_mode = "auto"
